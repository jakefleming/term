# Bundled defaults for term. Merged under user config (~/.config/term/config.toml)
# and project pipeline (<repo>/.term/pipeline.toml).
#
# Agents = CLI integrations. Roles = optional prompt-template wrappers.
# In a node you pick both independently: `agent = "claude-code"` plus
# (optionally) `role = "reviewer"`. The role's `agent` field is only used
# as a default if a node doesn't specify an agent explicitly.
#
# By default term starts with no nodes — build the pipeline as you go via
# F6 / "+ Add agent" / `:spawn`.

[agents.claude-code]
command = ["claude"]
one_shot = ["claude", "-p", "{prompt}"]
# Appended only when term is launched with --yolo / --dangerously-skip-permissions.
yolo_args = ["--dangerously-skip-permissions"]
# Used when you explicitly :resume a node (the session was previously seen).
resume_args = ["--continue"]
# Friendly model aliases for sub-task spawn requests (model = "opus"
# etc.). Inserted into the one_shot command before {prompt}.
[agents.claude-code.models]
opus    = ["--model", "claude-opus-4-7"]
sonnet  = ["--model", "claude-sonnet-4-6"]
haiku   = ["--model", "claude-haiku-4-5"]

[agents.codex]
command = ["codex"]
one_shot = ["codex", "exec", "{prompt}"]
# Appended when term is launched with --yolo. Bypasses codex's
# approval prompts AND its workspace sandbox so it can write to the
# mailbox (../../mail/...) and spawn dir (../../spawn/...) without
# pausing for confirmation. If your codex version uses different
# flags, override [agents.codex] in ~/.config/term/config.toml.
# Alternatives by version:
#   newer:  ["--dangerously-bypass-approvals-and-sandbox"]
#   older:  ["--ask-for-approval", "never", "--sandbox", "danger-full-access"]
yolo_args = ["--dangerously-bypass-approvals-and-sandbox"]
# Codex resume flag if your version supports it; user adjustable.
# resume_args = ["--continue"]
[agents.codex.models]
# Aliases assume gpt-5-family flags; adjust to match your codex version.
gpt-5      = ["--model", "gpt-5"]
gpt-5-mini = ["--model", "gpt-5-mini"]

[agents.shell]
command = ["bash"]

[roles.spec-writer]
agent = "claude-code"
prompt_template = """You are writing a specification. Produce a clear SPEC.md in this worktree that captures the problem, goals, non-goals, and key decisions. Ask clarifying questions if needed before writing."""

[roles.reviewer]
agent = "codex"
prompt_template = """Review SPEC.md that was just delivered into this worktree. Write your review to REVIEW.md, flagging gaps, ambiguities, contradictions, and risks. Be specific."""

[roles.builder]
agent = "claude-code"
prompt_template = """Implement SPEC.md, addressing the concerns in REVIEW.md. Make the changes directly in this worktree. Commit logically when you finish a unit of work."""

[pipeline]
name = "default"
nodes = []
