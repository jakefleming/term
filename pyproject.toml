[project]
name = "term"
version = "0.0.1"
description = "TUI for orchestrating CLI coding agents as a pipeline."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "ptyprocess>=0.7",
    "pyte>=0.8.2",
]

[project.scripts]
term = "term.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/term"]
